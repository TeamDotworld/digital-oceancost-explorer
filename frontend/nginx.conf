server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built JS/CSS have content hashes in their names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths like /overview or /droplets/details load index.html
    # and React Router shows the right page. index.html itself is never cached so new
    # deployments are picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
